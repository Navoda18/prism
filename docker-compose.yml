version: "3.8"

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: prism_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: prism_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d prism_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: prism_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  mock-provider:
    image: node:20-alpine
    container_name: prism_mock_provider
    working_dir: /app
    volumes:
      - ./tools/mock-provider:/app
    command: node index.js
    ports:
      - "4000:4000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:4000/health').then(r => r.ok ? process.exit(0) : process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 3

volumes:
  pgdata:
